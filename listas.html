<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mis listas — ProyectoWeb</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site">
  <div class="wrap site-bar">
    <a href="index.html" class="brand">ProyectoWeb</a>
    <button class="nav-toggle" id="navToggle" aria-label="Abrir menú" aria-expanded="false">☰</button>
    <nav class="primary" id="primaryNav">
      <a href="index.html">Catálogo</a>
      <a href="listas.html" class="active">Listas</a>
      <a href="perfil.html">Estadísticas</a>
    </nav>
    <div class="auth-links">
      <a href="login.html">Iniciar sesión</a>
      <a href="register.html" class="btn solid">Crear cuenta</a>

  </div>

<main>
<div class="wrap">
  <section class="block">
    <div class="block-head">
      <h2>Mis listas</h2>
      <span class="count">3 listas</span>
    </div>

    <div class="filmstrip">
      <a href="index.html" class="card">
        <div class="poster"><span class="initials">FV</span></div>
        <h3>Favoritas</h3>
        <div class="meta">8 películas</div>

      <a href="index.html" class="card">
        <div class="poster"><span class="initials">PV</span></div>
        <h3>Para ver</h3>
        <div class="meta">12 películas</div>
      </a>
      <a href="index.html" class="card">
        <div class="poster"><span class="initials">CN</span></div>
        <h3>Cine con amigos</h3>
        <div class="meta">5 películas</div>
      </a>
    </div>
  </section>
</div>
</main>

<footer class="site">
  <div class="wrap">
    ProyectoWeb — plataforma para registrar y calificar películas.
  </div>

<script src="js/script.js"></script>
