<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi perfil — ProyectoWeb</title>
  <link rel="stylesheet" href="css/style.css">
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3/dist/cdn.min.js"></script>
</head>
<body>

<header class="site">
  <div class="wrap site-bar">
    <a href="index.html" class="brand">ProyectoWeb</a>
    <button class="nav-toggle" id="navToggle" aria-label="Abrir menú" aria-expanded="false">☰</button>
    <nav class="primary" id="primaryNav">
      <a href="index.html">Catálogo</a>
      <a href="listas.html">Listas</a>
      <a href="perfil.html" class="active">Estadísticas</a>
    </nav>
    <div class="auth-links">
      <a href="login.html">Iniciar sesión</a>
      <a href="register.html" class="btn solid">Crear cuenta</a>
    </div>
  </div>
</header>

<main>
<div class="wrap">
  <div class="profile-head">
    <div class="avatar">CaP</div>
    <div>
      <h1>Carlos Peña</h1>
      <div class="sub">Miembro desde 2026</div>
    </div>
  </div>

  <div class="stat-row">
    <div><span class="num">48</span><span class="label">Vistas</span></div>
    <div><span class="num">31</span><span class="label">Reseñas</span></div>
    <div><span class="num">4.2</span><span class="label">Promedio</span></div>
    <div><span class="num">5</span><span class="label">Listas</span></div>
  </div>

  <div x-data="{ tab: 'vistas' }">
    <div class="tabs">
      <button :class="{ 'active': tab === 'vistas' }" @click="tab = 'vistas'" type="button">Vistas</button>
      <button :class="{ 'active': tab === 'resenas' }" @click="tab = 'resenas'" type="button">Reseñas</button>
      <button :class="{ 'active': tab === 'listas' }" @click="tab = 'listas'" type="button">Listas</button>
    </div>

    <div class="tab-panel" :class="{ 'active': tab === 'vistas' }" x-show="tab === 'vistas'">
      <div class="filmstrip"></div>
    </div>
    <div class="tab-panel" :class="{ 'active': tab === 'resenas' }" x-show="tab === 'resenas'">
      <p style="color:var(--text-dim)">Aquí aparecerán las reseñas que hayas escrito.</p>
    </div>
    <div class="tab-panel" :class="{ 'active': tab === 'listas' }" x-show="tab === 'listas'">
      <p style="color:var(--text-dim)">Aquí aparecerán tus listas personales.</p>
    </div>
  </div>
</div>
</main>

<footer class="site">
  <div class="wrap">
    ProyectoWeb — plataforma para registrar y calificar películas.
  </div>
</footer>

</body>
</html>
