<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión — ProyectoWeb</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="manifest" href="manifest.json">
  <script type="module" src="js/app.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3/dist/cdn.min.js"></script>
</head>
<body>

<header class="site" x-data="navegacionSitio">
  <div class="wrap site-bar">
    <a href="index.html" class="brand">ProyectoWeb</a>
    <button class="nav-toggle" id="navToggle" type="button" @click="alternarMenu()" aria-label="Abrir menú" :aria-expanded="menuAbierto">☰</button>
    <nav class="primary" id="primaryNav" :class="{ 'open': menuAbierto }">
      <a href="index.html">Catálogo</a>
      <a href="listas.html">Listas</a>
      <a href="perfil.html">Estadísticas</a>
      <a href="admin.html">Administración</a>
    </nav>
    <div class="auth-links">
      <a href="register.html" class="btn ghost">Crear cuenta</a>
    </div>
  </div>
</header>

<main>
<div class="form-shell" x-data="loginUsuario">
  <h1>Bienvenido de vuelta</h1>
  <p class="sub">Inicia sesión para ver tus películas y listas.</p>

  <p x-show="cargando" style="color:var(--text-dim);">Verificando credenciales…</p>
  <p x-show="error" x-text="error" style="color:#e57373;"></p>
  <p x-show="mensajeExito" x-text="mensajeExito" style="color:var(--accent);"></p>

  <form id="loginForm" @submit.prevent="enviarLogin()">
    <div class="field">
      <label for="email">Correo electrónico</label>
      <input type="email" id="email" x-model="email" placeholder="carlos@correo.com" required>
    </div>
    <div class="field">
      <label for="password">Contraseña</label>
      <input type="password" id="password" x-model="password" placeholder="••••••••" required>
    </div>
    <button type="submit" class="btn solid">Iniciar sesión</button>
  </form>

  <div style="margin-top:20px; border-top:1px solid var(--line); padding-top:14px;">
    <p style="font-size:0.8rem; color:var(--text-dim); margin:0 0 8px;">Cuentas de prueba rápidas:</p>
    <div style="display:flex; gap:8px; flex-wrap:wrap;">
      <button type="button" class="btn ghost" @click="accesoRapidoDemo('carlos@correo.com')" style="padding:5px 10px; font-size:0.78rem;">Admin (Carlos)</button>
      <button type="button" class="btn ghost" @click="accesoRapidoDemo('camila@correo.com')" style="padding:5px 10px; font-size:0.78rem;">Usuario (Camila)</button>
    </div>
  </div>

  <p class="switch">¿No tienes cuenta? <a href="register.html">Regístrate</a></p>
</div>
</main>

</body>
</html>
