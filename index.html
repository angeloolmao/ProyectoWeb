<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ProyectoWeb — Catálogo de Películas</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site">
  <div class="wrap site-bar">
    <a href="index.html" class="brand">ProyectoWeb</a>
    <button class="nav-toggle" id="navToggle" aria-label="Abrir menú" aria-expanded="false">☰</button>
    <nav class="primary" id="primaryNav">
      <a href="index.html" class="active">Catálogo</a>
      <a href="listas.html">Listas</a>
      <a href="perfil.html">Estadísticas</a>
    </nav>
    <div class="auth-links">
      <a href="login.html">Iniciar sesión</a>
      <a href="register.html" class="btn solid">Crear cuenta</a>
    </div>
  </div>
</header>

<main>
<section class="hero">
  <div class="wrap">
    <h1>Catálogo de Películas</h1>
    <p>Busca películas, califícalas y escribe reseñas.</p>
    <form class="search-row" id="searchForm">
      <input type="text" id="searchInput" aria-label="Buscar película por título" placeholder="Buscar por título…" autocomplete="off">
      <button class="btn ghost" type="submit">Buscar</button>
    </form>
  </div>
</section>

<section class="block">
  <div class="wrap">
    <div class="block-head">
      <h2>Catálogo</h2>
      <span class="count" id="resultCount">12 películas</span>
    </div>
    <div class="filmstrip" id="catalogGrid">
    </div>
  </div>
</section>
</main>

<footer class="site">
  <div class="wrap">
    ProyectoWeb — plataforma para registrar y calificar películas.
  </div>
</footer>

<script src="js/script.js"></script>
</body>
</html>
